services:
  xingchao-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      args:
        # pip 源：默认国内清华镜像（可在根 .env 用 PIP_INDEX_URL 覆盖，海外可改回官方源）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: xingchao-bot:latest
    container_name: xingchao-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./napcat/cache:/napcat-cache:ro
    ports:
      # Web 管理面板（与反向 WS 共用 8080），仅本机 / SSH 隧道访问
      - "127.0.0.1:8081:8080"
    networks:
      - xingchao

  xingchao-napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: xingchao-napcat
    restart: unless-stopped
    depends_on:
      - xingchao-bot
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      # - ACCOUNT=${QQ_ACCOUNT:-}  # 配合密码登录会卡死，暂回退
      # - NAPCAT_QUICK_PASSWORD=${QQ_PASSWORD:-}  # 4.18.19 密码登录卡死，暂回退二维码
    ports:
      # WebUI 只暴露给本机 / SSH 隧道，禁止 0.0.0.0
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/cache:/app/napcat/cache
      - ./napcat/qq:/app/.config/QQ
      # 本地红包补丁：把 QQ walletElement 转成 OneBot json 段，供 bot 识别。
      # NapCat 的插件目录是 /app/napcat/plugins（不是 config/plugins），
      # 插件管理器只放行官方 ID，所以借用 builtin 槽位。
      - ./scripts/napcat-wallet-plugin:/app/napcat/plugins/napcat-plugin-builtin:ro
    networks:
      - xingchao

networks:
  xingchao:
    driver: bridge

[project]
name = "xingchao-bot"
version = "0.1.0"
description = "星潮 Xingchao —— 基于 NapCat + NoneBot2 的 QQ 群助手（白名单群指令与关键词回复）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "nonebot2[fastapi]>=2.3,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "aiosqlite>=0.19",
    "websockets>=12.0",
    "httpx>=0.27",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

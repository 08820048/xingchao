[project]
name = "xingchao-bot"
version = "0.1.0"
description = "星潮 Xingchao —— 基于 NapCat + NoneBot2 的 QQ 群助手（白名单群指令与关键词回复）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "nonebot2[fastapi]>=2.3,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "aiosqlite>=0.19",
    "websockets>=12.0",
    "httpx>=0.27",
    "openai>=1.40",
    "nonebot-plugin-status>=0.7,<1",
    # ─── 第三方插件（详见 docs/THIRD_PARTY_PLUGINS.md）───
    # 注：heweather / dialectlist 因需 chromium 渲染（内存峰值高）已放弃，见该文档
    "nonebot-plugin-blacklist>=1.4.3,<2",
    "nonebot-plugin-cloudsignx>=3.1.0,<4",
    "nonebot-plugin-githubcard>=0.4.1,<1",   # 附带 alconna
    "nonebot-plugin-groupmate-waifu>=1.6.1,<2",
    "nonebot-plugin-miao>=1.1.0,<2",
    "nonebot-plugin-remake>=0.4.4,<1",       # 附带 alconna / pillow
    "nonebot-plugin-uninfo>=0.4,<1",          # handle 运行时依赖（handle 用 --no-deps 安装）
    "pypinyin>=0.40,<1",                       # handle 运行时依赖
    "pyjwt[crypto]>=2.10,<3",                  # /天气 QWeather JWT 鉴权
    "nonebot-plugin-batch-withdrawal>=0.0.6,<1",   # /delete 批量撤回
    "nonebot-plugin-botmailnotice>=0.0.3,<1",      # Bot 上下线邮件通知（需 SMTP 配置）
    "nonebot-plugin-emojilike>=0.2.4,<1",          # 被动：消息贴表情回应
    "nonebot-plugin-internet-outage>=0.1.4,<1",    # 服务器断网监控
    "nonebot-plugin-qrrender>=0.0.6,<1",           # /QR 二维码生成
    "nonebot-plugin-qqdetail>=2.0.0,<3",           # QQ 资料查询卡片
    "nonebot-plugin-revolver>=1.1.2,<2",           # /轮盘 /开枪 俄罗斯轮盘
    "nonebot-plugin-water-geoup-stats>=0.1.1,<1",  # /发言统计（纯文本，补 dialectlist 坑）
    # pokepoke_miss 用 --no-deps 装入 Dockerfile（其声明的 pil_utils==0.1.10 钉死 Pillow<11，
    # 但源码实际未 import pil_utils，属过时声明）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
